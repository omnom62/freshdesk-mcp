services:
  freshdesk-mcp:
    image: ghcr.io/omnom62/freshdesk-mcp:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MCP_TRANSPORT: http
      FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN}
      FRESHDESK_API_KEY: ${FRESHDESK_API_KEY}
      MCP_TOKEN: ${MCP_TOKEN}
      GCP_VISION_PROJECT: ${GCP_VISION_PROJECT:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
